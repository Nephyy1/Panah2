<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Workspace</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="ide-container">
    <div class="sidebar">
      <div class="file-explorer">EXPLORER</div>
      <div class="file">📄 index.html</div>
      <div class="file">🎨 style.css</div>
      <div class="file active-file">📜 main.js</div>
    </div>
    <div class="main-panel">
      <div class="tabs">
        <div class="tab">main.js</div>
      </div>
      <div id="terminal-container">
        <div class="terminal-header">TERMINAL - bash</div>
        <div id="terminal-output"></div>
      </div>
    </div>
  </div>

  <div id="camera-wrapper">
    <div class="camera-header">Live Preview</div>
    <video id="videoElement" autoplay playsinline muted></video>
    <canvas id="canvasElement"></canvas>
  </div>
  
  <div id="ui">
    <div class="init-box">
      <h1>WORKSPACE READY</h1>
      <button id="startButton">Run Dev Server</button>
      <p id="statusText"></p>
    </div>
  </div>
  
  <script type="module" src="./main.js"></script>
</body>
</html>
